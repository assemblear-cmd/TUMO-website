<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUMO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --black: #0a0a0a; --white: #f5f5f0; --mid: #888; --border: #2a2a2a; --nav-bg: #3d3d4a; }
html { scroll-behavior: smooth; }
body { background: var(--black); color: var(--white); font-family: 'Barlow', sans-serif; font-weight: 300; overflow-x: hidden; }

/* ════════════════════════════
   NAV  — exact TUMO mobile look
   ════════════════════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  background: var(--nav-bg);
  height: 70px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
}

/* TUMO outline-style SVG logo */
.nav-logo { text-decoration: none; display: flex; flex-direction: column; line-height: 1; }
.nav-logo-wordmark {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 0.06em;
  color: #fff;
  /* simulate the rounded/outlined look with text-stroke */
  -webkit-text-stroke: 1.5px #fff;
  color: transparent;
  line-height: 1;
}
.nav-logo-sub { display: block; font-family: 'Barlow', sans-serif; font-size: 7.5px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-top: 3px; }
.nav-logo-wordmark-row { display: flex; align-items: baseline; gap: 8px; }
.nav-logo-chile {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 0.06em;
  -webkit-text-stroke: 0.8px rgba(255,255,255,0.6);
  color: transparent;
  font-weight: 400;
  line-height: 1;
}

/* Hamburger — 2 lines style */
.hamburger {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; gap: 7px;
  padding: 8px;
}
.hamburger span {
  display: block; height: 2px; background: #fff;
  transition: all 0.3s ease;
}
.hamburger span:nth-child(1) { width: 32px; }
.hamburger span:nth-child(2) { width: 32px; }
.hamburger span:nth-child(3) { display: none; }
.hamburger.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
.hamburger.open span:nth-child(2) { transform: rotate(-45deg); }

/* Close × shown inside dropdown */
.nav-close {
  position: absolute; top: 20px; right: 20px;
  background: none; border: none; cursor: pointer;
  color: #fff; font-size: 28px; line-height: 1;
  display: none;
}

/* ── DROPDOWN OVERLAY ── */
.nav-dropdown {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--nav-bg);
  z-index: 490;
  display: flex; flex-direction: column;
  padding-top: 80px;
  transform: translateY(-100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
}
.nav-dropdown.open { transform: translateY(0); }

/* Logo row inside dropdown */
.dropdown-header {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 18px 20px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.dropdown-logo-wordmark {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px; letter-spacing: 0.06em;
  -webkit-text-stroke: 1.5px #fff; color: transparent;
}
.dropdown-logo-sub {
  font-family: 'Barlow', sans-serif;
  font-size: 7.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  margin-top: 2px;
}
.btn-close-x {
  background: none; border: none; color: #fff;
  font-size: 26px; cursor: pointer; line-height: 1; padding: 4px;
}

/* Menu items */
.dropdown-menu { list-style: none; flex: 1; }
.dropdown-menu li {
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.dropdown-menu li a {
  display: block;
  padding: 22px 20px;
  font-family: 'Barlow', sans-serif;
  font-size: 15px; font-weight: 400;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  transition: color 0.2s, padding-left 0.2s;
}
.dropdown-menu li a:hover { color: #fff; padding-left: 28px; }
.dropdown-menu li.donate a { color: #5b9bf8; }
.dropdown-menu li.donate a:hover { color: #8ab8ff; }

/* ════════════════════════════
   HERO
   ════════════════════════════ */
.hero {
  position: relative; width: 100%; height: calc(100vh - 70px); overflow: hidden;
  margin-top: 70px;
  background: var(--black);
}
.hero-img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center bottom;
  filter: grayscale(100%) contrast(1.05);
  animation: none;
}
@keyframes slowZoom {
  from { transform: scale(1.06); }
  to { transform: scale(1.0); }
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(10,10,10,0.2) 0%,
    rgba(10,10,10,0.12) 40%,
    rgba(10,10,10,0.65) 85%,
    rgba(10,10,10,1) 100%);
}
.hero-content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
}
.coming-soon-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
  color: rgba(245,245,240,0.6);
  margin-bottom: 20px;
  animation: fadeUp 1.2s ease 0.3s both;
}
.coming-soon-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(90px, 15vw, 200px);
  line-height: 0.88; letter-spacing: 0.04em;
  color: var(--white);
  animation: fadeUp 1.2s ease 0.5s both;
}
.hero-subtitle {
  margin-top: 28px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(245,245,240,0.55);
  animation: fadeUp 1.2s ease 0.7s both;
}
.hero-line { width: 1px; height: 52px; background: rgba(245,245,240,0.35); margin: 32px auto 0; animation: fadeUp 1.2s ease 0.9s both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: translateY(0); }
}
.scroll-hint {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  animation: fadeUp 1.2s ease 1.1s both;
}
.scroll-hint span { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mid); }
.scroll-dot { width: 1px; height: 36px; background: var(--mid); position: relative; overflow: hidden; }
.scroll-dot::after { content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 100%; background: var(--white); animation: scrollAnim 1.8s ease-in-out infinite; }
@keyframes scrollAnim { from { top: -100%; } to { top: 100%; } }

/* ════════════════════════════
   FOOTER
   ════════════════════════════ */
footer { border-top: 1px solid var(--border); padding: 48px; display: flex; justify-content: space-between; align-items: center; }
.footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.15em; color: var(--white); }
.footer-location { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--mid); }
.footer-copy { font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--border); letter-spacing: 0.05em; }

/* ════════════════════════════
   RESPONSIVE
   ════════════════════════════ */
@media (max-width: 700px) {
  footer { padding: 28px 20px; flex-direction: column; gap: 14px; text-align: center; }
}

</style>
</head>

    <div class="nav-logo-wordmark-row">
      <span class="nav-logo-wordmark">TUMO</span>
      <span class="nav-logo-chile">CHILE</span>
    </div>
    <span class="nav-logo-sub">Center for Creative Technologies</span>
  </a>
  <button class="hamburger" id="hamburger" aria-label="Menu">

</nav>

<script>
  const hamburger = document.getElementById('hamburger');
  const dropdown  = document.getElementById('navDropdown');
  const closeBtn  = document.getElementById('navClose');

  function openMenu() {
    dropdown.classList.add('open');
    hamburger.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    dropdown.classList.remove('open');
    hamburger.classList.remove('open');
    document.body.style.overflow = '';
  }

  hamburger.addEventListener('click', () => dropdown.classList.contains('open') ? closeMenu() : openMenu());
  closeBtn.addEventListener('click', closeMenu);

  dropdown.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
</script>
